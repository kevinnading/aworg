<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"
     width="1600" height="1000" role="img" aria-label="">
  <!-- Large shapes and high luminance, for the same reason as nocturne's:
       the chat's scrim keeps the conversation at WCAG AA over whatever is
       behind it, so about a third of this arrives. Anything subtle here is
       nothing there. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6a3c"/>
      <stop offset="0.45" stop-color="#a9834a"/>
      <stop offset="1" stop-color="#5b4527"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)"/>

  <!-- An arc, a disc and a rule: the grammar of a page, at poster size. -->
  <path d="M -60 960 A 640 640 0 0 1 1200 960" fill="none"
        stroke="url(#warm)" stroke-width="150" opacity="0.75"/>
  <circle cx="1300" cy="290" r="280" fill="#fde68a" opacity="0.55"/>
  <circle cx="1300" cy="290" r="160" fill="#fffbeb" opacity="0.7"/>
  <rect x="0" y="486" width="1600" height="14" fill="#fffbeb" opacity="0.6"/>
  <rect x="110" y="110" width="380" height="250" rx="22" fill="#fffbeb" opacity="0.35"/>
</svg>
