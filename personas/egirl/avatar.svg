<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nyx">
  <!-- A cat-eared head with a heart for a face: the aesthetic in one shape,
       drawn rather than set in type so it needs no font. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1035"/>
      <stop offset="1" stop-color="#12071a"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8cc6"/>
      <stop offset="1" stop-color="#e0338a"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="url(#ground)" stroke="#5b2a6e"/>
  <path d="M14 50 C 12 38, 13 26, 16 12 L 26 22 C 30 21, 34 21, 38 22 L 48 12
           C 51 26, 52 38, 50 50 C 44 55, 20 55, 14 50 Z" fill="url(#head)"/>
  <path d="M32 44 C 23 38, 22 31, 27 29.5 C 29.5 28.8, 31.3 30.4, 32 32
           C 32.7 30.4, 34.5 28.8, 37 29.5 C 42 31, 41 38, 32 44 Z" fill="#1a0a24"/>
  <path d="M47 8 L48.2 11.8 L52 13 L48.2 14.2 L47 18 L45.8 14.2 L42 13
