  <!-- Computational space inhabited by the Resident: a sparse node mesh on
       silver, gathered toward the edges. Heavier than it would be as
       standalone art, because the chat's scrim lets about a third of it
       through. Generated by a seeded script; re-running gives this file. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#F4F7F9"/>
      <stop offset="0.55" stop-color="#DCE5ED"/>
      <stop offset="1" stop-color="#EDF2F6"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#36B8FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#36B8FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 L0 0 0 80" fill="none" stroke="#7F91A3" stroke-width="1" opacity="0.28"/>
    </pattern>
    <linearGradient id="gridfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridmask">
      <rect width="1600" height="1000" fill="url(#gridfade)"/>
    </mask>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#grid)" mask="url(#gridmask)"/>
  <circle cx="1330" cy="210" r="420" fill="url(#core)"/>
  <circle cx="160" cy="900" r="300" fill="url(#core)" opacity="0.6"/>

